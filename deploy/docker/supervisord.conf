[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:chortke-web]
command=php -S 0.0.0.0:8090 -t /var/www/chortke/public
directory=/var/www/chortke
autostart=true
autorestart=true
stdout_logfile=/var/log/chortke-web.log
stderr_logfile=/var/log/chortke-web-error.log

[program:chortke-queue]
command=php /var/www/chortke/cli.php queue:work --daemon --sleep=1 --tries=3
directory=/var/www/chortke
autostart=true
autorestart=true
stdout_logfile=/var/log/chortke-queue.log
stderr_logfile=/var/log/chortke-queue-error.log

[program:chortke-outbox]
command=php /var/www/chortke/cli.php outbox:publish --limit=100 --sleep=5
directory=/var/www/chortke
autostart=true
autorestart=true
stdout_logfile=/var/log/chortke-outbox.log
stderr_logfile=/var/log/chortke-outbox-error.log
