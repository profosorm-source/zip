# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.dev.yml — Override برای محیط توسعه (Development)
#
# ⚠️  این فایل را هرگز در production استفاده نکنید!
#
# استفاده:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# یا برای راحتی، یک alias تعریف کنید:
#   alias dc-dev='docker-compose -f docker-compose.yml -f docker-compose.dev.yml'
# ─────────────────────────────────────────────────────────────────────────────

version: '3.8'

services:
  # در development، پورت‌ها فقط به localhost باند می‌شوند (نه 0.0.0.0)
  db:
    ports:
      - "127.0.0.1:3306:3306"   # فقط از localhost قابل دسترس — برای IDE/GUI client

  redis:
    ports:
      - "127.0.0.1:6379:6379"   # فقط از localhost قابل دسترس — برای redis-cli/GUI
