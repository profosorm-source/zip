version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# SECURITY NOTES:
#   - DB و Redis هیچ پورتی به اینترفیس عمومی expose نمی‌کنند.
#   - تمام سرویس‌های داخلی فقط از طریق Docker network با هم ارتباط دارند.
#   - پسوردهای پیش‌فرض حذف شدند — تمام مقادیر حساس باید در .env تنظیم شوند.
#   - برای توسعه (dev) محلی می‌توان از override file استفاده کرد:
#       docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# ─────────────────────────────────────────────────────────────────────────────

services:
  # 🌐 Web Server (Nginx)
  web:
    image: nginx:alpine
    container_name: chortke_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"     # فقط localhost — در production با reverse proxy جایگزین شود
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - chortke_network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 32M

  # 🐘 PHP Application (FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chortke_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chortke_network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M

  # 📅 Background Worker & Task Scheduler (Cron)
  #
  # CRITICAL: Scheduler از crontab استفاده می‌کند، نه while(true)+sleep.
  #   - while(true)+sleep مشکلات drift، overlap، و signal handling ایجاد می‌کند
  #   - crontab fire-and-forget هست و هر دقیقه دقیقاً اجرا میشه
  #   - cron.php خودش distributed lock داره برای جلوگیری از overlap
  #   - برای multi-node: فقط یک node باید scheduler رو اجرا کنه
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chortke_scheduler
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo '* * * * * php /var/www/html/cron.php >> /var/log/chortke-cron.log 2>&1' > /etc/crontabs/root
        crond -f -l 2
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chortke_network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M

  # ⚙️ Queue Worker — پردازش ناهمزمان job‌ها
  worker-queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chortke_worker_queue
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./storage/logs:/var/www/html/storage/logs
    # --sleep=3: وقتی queue خالی است ۳ ثانیه صبر کند (کاهش CPU idle)
    # --tries=3: هر job حداکثر ۳ بار تلاش شود
    # --max-jobs=500: بعد از ۵۰۰ job، worker ریستارت شود (memory leak prevention)
    command: php /var/www/html/cli.php queue:work --sleep=3 --tries=3 --max-jobs=500
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - WORKER_TYPE=queue
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chortke_network
    healthcheck:
      # بررسی اینکه process زنده است
      test: ["CMD", "php", "/var/www/html/cli.php", "queue:health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M

  # 📤 Outbox Publisher — انتشار رویدادهای outbox
  worker-outbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chortke_worker_outbox
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./storage/logs:/var/www/html/storage/logs
    # --limit=100: هر بار حداکثر ۱۰۰ event publish کند
    # --sleep=5: بین هر batch 5 ثانیه صبر کند
    command: php /var/www/html/cli.php outbox:publish --limit=100 --sleep=5
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - WORKER_TYPE=outbox
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chortke_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M

  # 🔁 DLQ Worker — بازپخش job‌های ناموفق
  worker-dlq:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chortke_worker_dlq
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./storage/logs:/var/www/html/storage/logs
    # --limit=50: هر batch حداکثر ۵۰ job
    # --sleep=10: بین هر batch 10 ثانیه صبر کند (DLQ نیاز به سرعت کمتر دارد)
    command: php /var/www/html/cli.php dlq:work --limit=50 --sleep=10
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - WORKER_TYPE=dlq
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chortke_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M

  # 🗄️ Relational Database (MariaDB 11.8 LTS)
  db:
    image: mariadb:11.8
    container_name: chortke_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}   # root جدا از DB_PASS
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    # SECURITY: هیچ پورتی expose نمی‌شود — فقط داخل Docker network قابل دسترس است
    # برای دسترسی مستقیم در development از docker-compose.dev.yml استفاده کنید
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - chortke_db_data:/var/lib/mysql
    networks:
      - chortke_network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M

  # 🚀 Cache & Session Store (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: chortke_redis
    restart: unless-stopped
    # SECURITY: احراز هویت اجباری + appendonly برای persistence + maxmemory برای جلوگیری از OOM
    command: >
      redis-server
      --appendonly yes
      --requirepass "${REDIS_PASSWORD}"
      --bind 0.0.0.0
      --protected-mode yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    # SECURITY: هیچ پورتی expose نمی‌شود — فقط داخل Docker network قابل دسترس است
    volumes:
      - chortke_redis_data:/data
    networks:
      - chortke_network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 64M

networks:
  chortke_network:
    driver: bridge
    # شبکه داخلی ایزوله — سرویس‌های خارجی دسترسی ندارند
    internal: false   # web باید به اینترنت دسترسی داشته باشد؛ db/redis ندارند

volumes:
  chortke_db_data:
    driver: local
  chortke_redis_data:
    driver: local
