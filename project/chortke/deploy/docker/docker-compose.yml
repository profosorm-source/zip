version: '3.8'

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: chortke-app
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: chortke
      DB_USER: chortke_user
      DB_PASS: ${DB_PASS}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_CONNECTION: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chortke_storage:/var/www/chortke/storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 256M

  # Background workers (separate containers = horizontal scaling)
  worker-queue:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: chortke-worker-queue
    command: php cli.php queue:work --daemon --sleep=1 --tries=3
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: chortke
      DB_USER: chortke_user
      DB_PASS: ${DB_PASS}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_CONNECTION: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M

  worker-outbox:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: chortke-worker-outbox
    command: php cli.php outbox:publish --limit=100 --sleep=5
    environment:
      APP_ENV: production
      DB_HOST: db
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M

  worker-dlq:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: chortke-worker-dlq
    command: php cli.php dlq:work --limit=50 --sleep=10
    environment:
      APP_ENV: production
      DB_HOST: db
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M

  # Scheduler — crontab-based (not while+sleep)
  scheduler:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: chortke-scheduler
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo '* * * * * php /var/www/chortke/cron.php >> /var/log/chortke/cron.log 2>&1' > /etc/crontabs/root
        crond -f -l 2
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: chortke
      DB_USER: chortke_user
      DB_PASS: ${DB_PASS}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 64M

  db:
    image: mariadb:11.8
    container_name: chortke-db
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: chortke
      MARIADB_USER: chortke_user
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      - chortke_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: chortke-redis
    command: >
      redis-server
      --appendonly yes
      --requirepass "${REDIS_PASSWORD}"
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
        reservations:
          memory: 128M

volumes:
  chortke_db_data:
  chortke_storage:
