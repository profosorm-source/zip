[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
logfile_maxbytes=50MB
logfile_backups=5

; ─── PHP Built-in Server (for single-container deploy) ───────
[program:chortke-web]
command=php -S 0.0.0.0:8090 -t /var/www/chortke/public
directory=/var/www/chortke
autostart=true
autorestart=true
startretries=10
stdout_logfile=/var/log/chortke/web.log
stderr_logfile=/var/log/chortke/web-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

; ─── Queue Worker ────────────────────────────────────────────
[program:chortke-queue]
command=php /var/www/chortke/cli.php queue:work --daemon --sleep=1 --tries=3 --max-time=3600
directory=/var/www/chortke
user=www-data
numprocs=3
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startretries=10
stdout_logfile=/var/log/chortke/queue-%(process_num)02d.log
stderr_logfile=/var/log/chortke/queue-%(process_num)02d-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=60
stopsignal=SIGTERM

; ─── Outbox Publisher ────────────────────────────────────────
[program:chortke-outbox]
command=php /var/www/chortke/cli.php outbox:publish --limit=100 --sleep=5
directory=/var/www/chortke
user=www-data
numprocs=1
autostart=true
autorestart=true
startretries=10
stdout_logfile=/var/log/chortke/outbox.log
stderr_logfile=/var/log/chortke/outbox-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

; ─── DLQ Worker (Dead Letter Queue) ─────────────────────────
[program:chortke-dlq]
command=php /var/www/chortke/cli.php dlq:work --limit=50 --sleep=10
directory=/var/www/chortke
user=www-data
numprocs=1
autostart=true
autorestart=true
startretries=10
stdout_logfile=/var/log/chortke/dlq.log
stderr_logfile=/var/log/chortke/dlq-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

; ─── Cron Scheduler (crontab-based, not while+sleep) ────────
[program:chortke-cron]
command=/bin/sh -c "echo '* * * * * php /var/www/chortke/cron.php >> /var/log/chortke/cron.log 2>&1' > /etc/crontabs/root && crond -f -l 2"
directory=/var/www/chortke
autostart=true
autorestart=true
startretries=10
stdout_logfile=/var/log/chortke/cron-supervisor.log
stderr_logfile=/var/log/chortke/cron-supervisor-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
