[program:chortke-outbox]
command=php /var/www/chortke/cli.php outbox:publish --limit=100 --sleep=5
directory=/var/www/chortke
user=www-data
numprocs=1
autostart=true
autorestart=true
startretries=10
stdout_logfile=/var/log/chortke/outbox.log
stderr_logfile=/var/log/chortke/outbox-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
