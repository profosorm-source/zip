# ── Rate limit zone برای long-poll ──────────────────────────────────────────
# حداکثر 6 request در دقیقه per IP برای polling endpoint
# (20s timeout × 3 = 60s → یعنی هر IP فقط 3 poll همزمان منطقی است)
limit_req_zone $binary_remote_addr zone=longpoll:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=poll_conn:10m;

server {
    listen 80;
    server_name localhost;
    client_max_body_size 10M;
    root /var/www/html/public;

    index index.php index.html;
    charset utf-8;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # ── Long-Poll endpoint — محدودیت اختصاصی ──────────────────────────────────
    # هر IP حداکثر 2 connection همزمان + rate limit 6/min
    # fastcgi_read_timeout = 25s (کمی بیشتر از POLL_TIMEOUT=20s)
    location = /api/real-time/poll {
        # rate limit: burst=2 بدون delay → درخواست سوم رد می‌شود
        limit_req zone=longpoll burst=2 nodelay;
        limit_req_status 429;

        # حداکثر 2 connection همزمان per IP
        limit_req zone=longpoll burst=2 nodelay;
        limit_req_status 429;

        # maximum 2 concurrent per IP
        limit_conn poll_conn 2;
        limit_conn_status 429;

        # allow PHP-FPM to hold connection up to 25s
        fastcgi_read_timeout 25s;
        fastcgi_send_timeout 25s;

        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # use same buffers as main php block
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_buffering off;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
